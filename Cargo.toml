[workspace]
members = [
    "bins/siphond",
    "crates/sip-core",
    "crates/sip-parse",
    "crates/sip-transport",
    "crates/sip-transaction",
    "crates/sip-dns",
    "crates/sip-dialog",
    "crates/sip-auth",
    "crates/sip-identity",
    "crates/sip-registrar",
    "crates/sip-proxy",
    "crates/sip-uas",
    "crates/sip-uac",
    "crates/sip-sdp",
    "crates/sip-observe",
    "crates/sip-hep",
    "crates/sip-testkit",
    "crates/sip-ratelimit",
]
resolver = "2"

[workspace.package]
license = "MIT OR Apache-2.0"
edition = "2021"
authors = ["siphon-rs contributors"]
repository = "https://github.com/feryx-io/siphon-rs"
homepage = "https://github.com/feryx-io/siphon-rs"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
bytes = "1.11.1"
serde = { version = "1", features = ["derive"] }
smol_str = "0.3"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
rand = "0.10"
dashmap = "5"
parking_lot = "0.12"
once_cell = "1.19"
httpdate = "1.0"

# Workspace crates. `path` is what a workspace build uses; `version` is what a
# published crate's dependents resolve against on crates.io. Bumping a crate's
# version means updating its line here too (see RELEASING.md).
siphon-core = { path = "crates/sip-core", version = "0.7.8" }
siphon-parse = { path = "crates/sip-parse", version = "0.4.0" }
siphon-transport = { path = "crates/sip-transport", version = "0.8.0" }
siphon-transaction = { path = "crates/sip-transaction", version = "0.9.1" }
siphon-dns = { path = "crates/sip-dns", version = "0.3.0" }
siphon-dialog = { path = "crates/sip-dialog", version = "0.4.0" }
siphon-auth = { path = "crates/sip-auth", version = "0.4.0" }
siphon-registrar = { path = "crates/sip-registrar", version = "0.3.2" }
siphon-proxy = { path = "crates/sip-proxy", version = "0.3.0" }
siphon-uas = { path = "crates/sip-uas", version = "0.5.2" }
siphon-uac = { path = "crates/sip-uac", version = "0.9.6" }
siphon-sdp = { path = "crates/sip-sdp", version = "0.3.2" }
siphon-observe = { path = "crates/sip-observe", version = "0.3.0" }
siphon-hep = { path = "crates/sip-hep", version = "0.1.0" }
siphon-ratelimit = { path = "crates/sip-ratelimit", version = "0.3.0" }

# hep-rs lives in its own repo (github.com/feryx-io/hep-rs) and is taken from
# crates.io.
hep-rs = "0.1"
