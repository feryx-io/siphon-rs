[package]
name = "siphond"
version = "0.7.3"
edition = "2021"
license.workspace = true
description = "Multi-mode SIP testing daemon."
readme = "README.md"
authors.workspace = true
repository.workspace = true

[dependencies]
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = { workspace = true }
anyhow = { workspace = true }
siphon-transport = { workspace = true, features = ["tls"] }
siphon-parse = { workspace = true }
siphon-core = { workspace = true }
siphon-observe = { workspace = true }
siphon-transaction = { workspace = true }
siphon-dialog = { workspace = true }
siphon-auth = { workspace = true }
siphon-registrar = { workspace = true }
siphon-proxy = { workspace = true }
siphon-uas = { workspace = true }
siphon-uac = { workspace = true }
siphon-sdp = { workspace = true }
siphon-ratelimit = { workspace = true }
clap = { version = "4", features = ["derive"] }
smol_str = { workspace = true }
async-trait = "0.1"
rand = { workspace = true }
dashmap = { workspace = true }
serde = { workspace = true }
serde_json = "1"
unicode-normalization = "0.1"
tokio-rustls = { version = "0.26", optional = true }
webpki-roots = { version = "0.26", optional = true }

[features]
default = ["tls"]
tls = ["tokio-rustls", "webpki-roots"]
ws = ["siphon-transport/ws"]
webrtc = ["ws"]

[dev-dependencies]
tempfile = "3"
